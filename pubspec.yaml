name: meow_translate
description: A native-feeling macOS app for translating ebooks with AI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  archive: ^4.0.9
  crypto: ^3.0.7
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0
  http: ^1.6.0
  macos_ui: ^2.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  xml: ^6.6.1
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.1.0

flutter:
  uses-material-design: true
